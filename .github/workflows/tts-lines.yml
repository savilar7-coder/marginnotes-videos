name: tts-lines
# On-demand narration: one mp3 per line, returned as a 1-day artifact (nothing committed, text never printed).
# mode=search lists library voices for a query; mode=add adds a library voice (owner_id/voice_id); mode=speak makes audio.
# mode=sfx: lines_b64 = base64 JSON array of {text, duration_seconds?, loop?, prompt_influence?, name?} -> one mp3 each (eleven_text_to_sound_v3).
# mode=music: lines_b64 = base64 JSON array of {prompt, music_length_ms, name?} -> one instrumental mp3 each (music_v2_5).
# mode=usage: prints the subscription's credit count and limit (two numbers), nothing else.
on:
  workflow_dispatch:
    inputs:
      mode: {required: true, default: speak}
      voice: {required: false, default: ""}
      model: {required: false, default: eleven_multilingual_v2}
      lines_b64: {required: false, default: ""}
      query: {required: false, default: ""}
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: ElevenLabs
        env:
          XI_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          MODE: ${{ inputs.mode }}
          VOICE: ${{ inputs.voice }}
          MODEL: ${{ inputs.model }}
          LINES: ${{ inputs.lines_b64 }}
          QUERY: ${{ inputs.query }}
        run: |
          python3 - <<'PY'
          import os, json, base64, urllib.request, urllib.error
          key, mode = os.environ["XI_KEY"], os.environ["MODE"]
          def call(url, body=None, raw=False):
              req = urllib.request.Request(url, data=json.dumps(body).encode() if body is not None else None,
                    headers={"xi-api-key": key, "Content-Type": "application/json"})
              try:
                  r = urllib.request.urlopen(req, timeout=300)
                  return r.read() if raw else json.load(r)
              except urllib.error.HTTPError as e:
                  print("HTTP", e.code, e.read()[:500]); raise
          if mode == "search":
              r = call("https://api.elevenlabs.io/v1/shared-voices?page_size=40&" + os.environ["QUERY"])
              for v in r.get("voices", []):
                  print(v.get("name"), "|", v.get("accent"), v.get("gender"), v.get("age"), v.get("use_case"), "|",
                        v.get("public_owner_id"), v.get("voice_id"), "| uses", v.get("cloned_by_count"), "|",
                        (v.get("description") or "")[:120].replace("\n", " "))
          elif mode == "add":
              owner, vid = os.environ["VOICE"].split("/")
              print(call(f"https://api.elevenlabs.io/v1/voices/add/{owner}/{vid}", {"new_name": "es-mx narrator"}))
          elif mode == "usage":
              # needs the user_read permission on the key; without it this prints the HTTP 401 and fails
              r = call("https://api.elevenlabs.io/v1/user/subscription")
              print("used", int(r["character_count"]), "limit", int(r["character_limit"]))
          elif mode in ("sfx", "music"):
              import re
              items = json.loads(base64.b64decode(os.environ["LINES"]).decode("utf-8"))
              os.makedirs("out", exist_ok=True)
              def used():
                  try:
                      req = urllib.request.Request("https://api.elevenlabs.io/v1/user/subscription", headers={"xi-api-key": key})
                      return int(json.load(urllib.request.urlopen(req, timeout=60))["character_count"])
                  except Exception: return None
              def post(url, body, timeout):
                  req = urllib.request.Request(url, data=json.dumps(body).encode(),
                        headers={"xi-api-key": key, "Content-Type": "application/json"})
                  try:
                      r = urllib.request.urlopen(req, timeout=timeout)
                      cost = {k.lower(): v for k, v in r.headers.items() if re.search("cost|credit|character", k, re.I)}
                      return r.read(), cost
                  except urllib.error.HTTPError as e:
                      print("HTTP", e.code, e.read()[:500]); return None, {}
                  except Exception as e:
                      print("ERR", type(e).__name__); return None, {}
              before, made, costs = used(), 0, []
              for i, it in enumerate(items):
                  name = re.sub(r"[^a-z0-9_-]", "", str(it.get("name", "")).lower()) or f"{mode}{i}"
                  if mode == "sfx":
                      body = {"text": it["text"], "model_id": "eleven_text_to_sound_v3"}
                      for k in ("duration_seconds", "loop", "prompt_influence"):
                          if it.get(k) is not None: body[k] = it[k]
                      audio, cost = post("https://api.elevenlabs.io/v1/sound-generation?output_format=mp3_44100_192", body, 300)
                  else:
                      body = {"prompt": it["prompt"], "music_length_ms": int(it["music_length_ms"]),
                              "model_id": "music_v2_5", "force_instrumental": True}
                      audio, cost = post("https://api.elevenlabs.io/v1/music", body, 1200)
                  if audio:
                      open(f"out/{name}.mp3", "wb").write(audio); made += 1
                  costs.append(cost.get("character-cost", cost or None))
              after = used()
              print("made", made, "of", len(items), mode, "| cost per item", costs,
                    "| balance used before", before, "after", after)
              if not made: raise SystemExit(1)
          else:
              lines = json.loads(base64.b64decode(os.environ["LINES"]).decode("utf-8"))
              os.makedirs("out", exist_ok=True)
              v3 = os.environ["MODEL"] == "eleven_v3"  # v3: stability 0.0/0.5/1.0 only, direction comes from [tags] in the text
              vs = {"stability": 0.0, "similarity_boost": 0.8, "use_speaker_boost": True} if v3 else                    {"stability": 0.45, "similarity_boost": 0.8, "style": 0.15, "use_speaker_boost": True}
              for i, t in enumerate(lines):
                  body = {"text": t, "model_id": os.environ["MODEL"], "voice_settings": vs}
                  if not v3:
                      body.update(previous_text=lines[i - 1] if i else None, next_text=lines[i + 1] if i + 1 < len(lines) else None)
                  open(f"out/line{i}.mp3", "wb").write(call(
                      f"https://api.elevenlabs.io/v1/text-to-speech/{os.environ['VOICE']}?output_format=mp3_44100_128", body, raw=True))
              print("made", len(lines), "lines")
          PY
      - if: inputs.mode == 'speak' || inputs.mode == 'sfx' || inputs.mode == 'music'
        uses: actions/upload-artifact@v4
        with: {name: audio, path: out/, retention-days: 1}
