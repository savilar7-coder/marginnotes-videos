name: probe-videos
on:
  push:
    paths: ["probe.txt"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
      - name: Probe each video's size and length
        run: |
          : > probe-results.txt
          while read -r name url; do
            [ -z "$name" ] && continue
            r=$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height:format=duration -of csv=p=0:s=x "$url" | tr '\n' ' ')
            echo "$name $r" | tee -a probe-results.txt
          done < probe.txt
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe-results.txt && git commit -m "Probe results" && git push
